name: Build and deploy Git tutorial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the offline Git exercise
        run: python3 examples/verify_demo.py

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            just pandoc texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures librsvg2-bin

      - name: Build handout, short slides, and website
        run: just build

      - name: Validate site links and PDFs
        run: python3 scripts/verify_site.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website and PDFs
        id: deployment
        uses: actions/deploy-pages@v4
